# 首次部署使用的 HTTP 配置：先启用它，再用 certbot 自动加 HTTPS
# （证书文件还不存在时，直接启用带 ssl_certificate 的配置会让 nginx -t 失败）

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 20m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # certbot HTTP-01 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # 视频 / 封面：Nginx 直接读磁盘，支持 Range 拖动
    location /media/ {
        alias /opt/yoji/media/;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;

        types {
            video/mp4  mp4 m4v;
            video/webm webm;
            image/png  png;
            image/jpeg jpg jpeg;
        }
        default_type application/octet-stream;

        autoindex off;
        location ~ /\. {
            deny all;
        }
    }

    access_log /var/log/nginx/yoji-api.access.log;
    error_log  /var/log/nginx/yoji-api.error.log warn;
}
