# 视频学习：Nginx 反向代理 + 静态媒体文件（手动 HTTPS 版）
#
# 首次部署请先用 nginx-yoji-http.conf + certbot 自动申请证书：
#   cp deploy/nginx-yoji-http.conf /etc/nginx/sites-available/yoji-api.conf
#   certbot --nginx -d 你的域名
# 证书签发成功后，certbot 会自动在配置里加上 443；本文件仅作为
# “想手动管理证书 / 需要更多 TLS 细节”时的参考模板。
#
# 使用前把 api.example.com 换成你的域名，证书路径由 certbot 生成：
#   /etc/letsencrypt/live/<域名>/

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # certbot HTTP-01 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 只接受 JSON / 表单，限制请求体大小
    client_max_body_size 20m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ---- 媒体文件：视频 / 封面 ----
    # 由 Nginx 直接读磁盘，支持 Range 拖动进度条，不占用 Node 进程
    location /media/ {
        alias /opt/yoji/media/;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;

        types {
            video/mp4  mp4 m4v;
            video/webm webm;
            image/png  png;
            image/jpeg jpg jpeg;
        }
        default_type application/octet-stream;

        # 隐藏文件与目录列表
        autoindex off;
        location ~ /\. {
            deny all;
        }
    }

    access_log /var/log/nginx/yoji-api.access.log;
    error_log  /var/log/nginx/yoji-api.error.log warn;
}
